  <text x="110" y="594" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#202b29">Sunit Mehta (22106059)</text>
  <text x="110" y="634" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#202b29">Sumeet Kumar Panda (22106048)</text>

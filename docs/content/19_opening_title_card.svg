  <rect x="0" y="0" width="1600" height="900" fill="#202b29"/>
  <rect x="64" y="64" width="1472" height="772" rx="10" fill="#f8f5ee"/>

  <image href="18_pec_logo.png" x="110" y="105" width="112" height="112" preserveAspectRatio="xMidYMid meet"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Ink Detection Model Pipeline</title>
  <desc id="desc">CT or unwrapped image patches flow into the model, producing an ink probability map, a thresholded ink mask, and candidate text regions.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 12; }
      .title { font: 700 22px Arial, sans-serif; fill: #0f172a; }
      .text { font: 16px Arial, sans-serif; fill: #334155; }
      .small { font: 14px Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 3; marker-end: url(#arrow); fill: none; }
      .accent { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; rx: 12; }
      .prob { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 12; }
      .mask { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 12; }
    </style>
  </defs>

  <rect x="30" y="55" width="190" height="150" class="box"/>
  <text x="125" y="100" text-anchor="middle" class="title">CT / Unwrapped</text>
  <text x="125" y="128" text-anchor="middle" class="title">Image Patches</text>
  <text x="125" y="162" text-anchor="middle" class="text">17 z-slices</text>
  <text x="125" y="184" text-anchor="middle" class="small">64 x 64 patch</text>

  <path d="M230 130 L310 130" class="arrow"/>

  <rect x="320" y="55" width="190" height="150" class="accent"/>
  <text x="415" y="102" text-anchor="middle" class="title">Model</text>
  <text x="415" y="136" text-anchor="middle" class="text">U-Net + CNN</text>
  <text x="415" y="160" text-anchor="middle" class="text">3D CNN + Transformers</text>
  <text x="415" y="184" text-anchor="middle" class="small">soft-voting ensemble</text>

  <path d="M520 130 L600 130" class="arrow"/>

  <rect x="610" y="55" width="190" height="150" class="prob"/>
  <text x="705" y="104" text-anchor="middle" class="title">Ink Probability</text>
  <text x="705" y="132" text-anchor="middle" class="title">Map</text>
  <text x="705" y="166" text-anchor="middle" class="text">pixel-wise score</text>
  <text x="705" y="188" text-anchor="middle" class="small">brighter = more likely ink</text>

  <path d="M810 130 L890 130" class="arrow"/>

  <rect x="900" y="55" width="190" height="150" class="mask"/>
  <text x="995" y="104" text-anchor="middle" class="title">Thresholded</text>
  <text x="995" y="132" text-anchor="middle" class="title">Ink Mask</text>
  <text x="995" y="166" text-anchor="middle" class="text">threshold = 0.25</text>
  <text x="995" y="188" text-anchor="middle" class="small">candidate ink pixels</text>

  <path d="M995 215 C995 250 180 250 180 215" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="7 7"/>
  <text x="600" y="252" text-anchor="middle" class="small">review loop: compare predictions with labels and CT context</text>

  <path d="M1098 130 L1160 130" class="arrow"/>
  <text x="1170" y="116" text-anchor="middle" class="title">Candidate</text>
  <text x="1170" y="144" text-anchor="middle" class="title">Text Regions</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Project results and artifacts</title>
  <desc id="desc">A visual summary of the concrete outputs produced by the Vesuvius scroll project.</desc>
  <rect width="1600" height="900" fill="#f9f7f2"/>
  <text x="80" y="95" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" fill="#202b29">What the project produces</text>
  <text x="82" y="145" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#5b6461">Show these as results in the final minute of the video</text>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif" filter="url(#shadow)">
    <g transform="translate(120 250)">
      <rect width="300" height="380" rx="8" fill="#ffffff" stroke="#d8d1c6"/>
      <rect x="55" y="50" width="190" height="135" fill="#23312f"/>
      <path d="M78 140 C112 96, 139 162, 184 74 C205 105, 214 132, 229 161" fill="none" stroke="#e8c25a" stroke-width="12" stroke-linecap="round"/>
      <text x="150" y="248" text-anchor="middle" font-size="28" font-weight="700" fill="#202b29">Ink maps</text>
      <text x="150" y="292" text-anchor="middle" font-size="21" fill="#5b6461">Probable ink regions</text>
      <text x="150" y="324" text-anchor="middle" font-size="21" fill="#5b6461">made visible</text>
    </g>

    <g transform="translate(480 250)">
      <rect width="300" height="380" rx="8" fill="#ffffff" stroke="#d8d1c6"/>
      <rect x="48" y="72" width="204" height="86" fill="#eee8db" stroke="#b9aa98"/>
      <text x="70" y="132" font-size="48" font-weight="700" fill="#26312f">A B G</text>
      <rect x="61" y="87" width="55" height="62" fill="none" stroke="#cf5644" stroke-width="6"/>
      <rect x="125" y="87" width="52" height="62" fill="none" stroke="#cf5644" stroke-width="6"/>
      <rect x="186" y="87" width="48" height="62" fill="none" stroke="#cf5644" stroke-width="6"/>
      <text x="150" y="248" text-anchor="middle" font-size="28" font-weight="700" fill="#202b29">Candidates</text>
      <text x="150" y="292" text-anchor="middle" font-size="21" fill="#5b6461">Letters marked</text>
      <text x="150" y="324" text-anchor="middle" font-size="21" fill="#5b6461">for review</text>
    </g>

    <g transform="translate(840 250)">
      <rect width="300" height="380" rx="8" fill="#ffffff" stroke="#d8d1c6"/>
      <rect x="55" y="58" width="190" height="120" fill="#26312f"/>
      <rect x="78" y="86" width="144" height="16" fill="#d9c072"/>
      <rect x="78" y="118" width="112" height="16" fill="#d9c072"/>
      <rect x="78" y="150" width="132" height="16" fill="#d9c072"/>
      <text x="150" y="248" text-anchor="middle" font-size="28" font-weight="700" fill="#202b29">Text strips</text>
      <text x="150" y="292" text-anchor="middle" font-size="21" fill="#5b6461">Focused regions</text>
      <text x="150" y="324" text-anchor="middle" font-size="21" fill="#5b6461">for decipherment</text>
    </g>

    <g transform="translate(1200 250)">
      <rect width="300" height="380" rx="8" fill="#ffffff" stroke="#d8d1c6"/>
      <rect x="58" y="58" width="184" height="122" fill="#eef0ec" stroke="#c9cec8"/>
      <rect x="82" y="86" width="136" height="14" rx="7" fill="#52756d"/>
      <rect x="82" y="116" width="104" height="14" rx="7" fill="#b98d3d"/>
      <rect x="82" y="146" width="124" height="14" rx="7" fill="#cf5644"/>
      <text x="150" y="248" text-anchor="middle" font-size="28" font-weight="700" fill="#202b29">Review output</text>
      <text x="150" y="292" text-anchor="middle" font-size="21" fill="#5b6461">Provisional readings</text>
      <text x="150" y="324" text-anchor="middle" font-size="21" fill="#5b6461">with uncertainty visible</text>
    </g>
  </g>

  <rect x="260" y="720" width="1080" height="72" rx="8" fill="#202b29"/>
  <text x="800" y="766" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#ffffff">Result message: not final transcription, but practical reviewable evidence.</text>
</svg>

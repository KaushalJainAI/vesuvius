<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent SDK call returning JSON</title>
  <desc id="desc">Concise vertical pipeline: client calls Agent SDK, agent runs model and tools, returns structured JSON.</desc>

  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,2 L12,7 L2,12 Z" fill="#3D3929"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Anthropic-inspired light cream background -->
  <rect width="600" height="900" fill="#F5F4EE"/>

  <text x="300" y="62" text-anchor="middle" font-family="Söhne, Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F1F1E">Agent SDK → JSON</text>
  <line x1="240" y1="78" x2="360" y2="78" stroke="#CC785C" stroke-width="3" stroke-linecap="round"/>

  <g font-family="Söhne, Inter, Arial, sans-serif">

    <!-- 1 Client -->
    <g transform="translate(150 110)" filter="url(#shadow)">
      <rect width="300" height="90" rx="10" fill="#FFFFFF" stroke="#E8E4D8"/>
      <rect width="6" height="90" rx="3" fill="#CC785C"/>
      <circle cx="46" cy="45" r="20" fill="#CC785C"/>
      <text x="46" y="52" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">1</text>
      <text x="82" y="42" font-size="18" font-weight="600" fill="#1F1F1E">Client</text>
      <text x="82" y="66" font-size="14" fill="#6B6557">prompt + schema</text>
    </g>
    <line x1="300" y1="200" x2="300" y2="240" stroke="#3D3929" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- 2 Runner -->
    <g transform="translate(150 250)" filter="url(#shadow)">
      <rect width="300" height="90" rx="10" fill="#FFFFFF" stroke="#E8E4D8"/>
      <rect width="6" height="90" rx="3" fill="#6B8E7F"/>
      <circle cx="46" cy="45" r="20" fill="#6B8E7F"/>
      <text x="46" y="52" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">2</text>
      <text x="82" y="42" font-size="18" font-weight="600" fill="#1F1F1E">Runner.run()</text>
      <text x="82" y="66" font-size="14" fill="#6B6557">Agent SDK call</text>
    </g>
    <line x1="300" y1="340" x2="300" y2="380" stroke="#3D3929" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- 3 Model + tools -->
    <g transform="translate(150 390)" filter="url(#shadow)">
      <rect width="300" height="90" rx="10" fill="#FFFFFF" stroke="#E8E4D8"/>
      <rect width="6" height="90" rx="3" fill="#7C6A8F"/>
      <circle cx="46" cy="45" r="20" fill="#7C6A8F"/>
      <text x="46" y="52" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">3</text>
      <text x="82" y="42" font-size="18" font-weight="600" fill="#1F1F1E">Model + tools</text>
      <text x="82" y="66" font-size="14" fill="#6B6557">reason · call · validate</text>
    </g>
    <line x1="300" y1="480" x2="300" y2="520" stroke="#3D3929" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- 4 JSON panel -->
    <g transform="translate(110 530)" filter="url(#shadow)">
      <rect width="380" height="160" rx="10" fill="#1F1F1E"/>
      <rect width="380" height="32" rx="10" fill="#2A2A28"/>
      <rect y="22" width="380" height="10" fill="#2A2A28"/>
      <circle cx="18" cy="16" r="5" fill="#CC785C"/>
      <circle cx="34" cy="16" r="5" fill="#D4A75E"/>
      <circle cx="50" cy="16" r="5" fill="#6B8E7F"/>
      <text x="370" y="20" text-anchor="end" font-family="Consolas, monospace" font-size="11" fill="#8A8675">result.json</text>
      <text x="20" y="58" font-family="Consolas, monospace" font-size="14" fill="#D8E7E1">{</text>
      <text x="20" y="80" font-family="Consolas, monospace" font-size="14" fill="#D8E7E1">  "reading": <tspan fill="#D4A75E">"ΕΠΙΚΟΥΡΟΥ"</tspan>,</text>
      <text x="20" y="102" font-family="Consolas, monospace" font-size="14" fill="#D8E7E1">  "confidence": <tspan fill="#9ECBBD">0.82</tspan>,</text>
      <text x="20" y="124" font-family="Consolas, monospace" font-size="14" fill="#D8E7E1">  "alternates": [ ... ]</text>
      <text x="20" y="146" font-family="Consolas, monospace" font-size="14" fill="#D8E7E1">}</text>
    </g>
    <line x1="300" y1="690" x2="300" y2="730" stroke="#3D3929" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- 5 Consumer -->
    <g transform="translate(150 740)" filter="url(#shadow)">
      <rect width="300" height="90" rx="10" fill="#FFFFFF" stroke="#E8E4D8"/>
      <rect width="6" height="90" rx="3" fill="#D4A75E"/>
      <circle cx="46" cy="45" r="20" fill="#D4A75E"/>
      <text x="46" y="52" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">4</text>
      <text x="82" y="42" font-size="18" font-weight="600" fill="#1F1F1E">Consumer</text>
      <text x="82" y="66" font-size="14" fill="#6B6557">render · store · chain</text>
    </g>

  </g>

  <text x="300" y="870" text-anchor="middle" font-family="Söhne, Inter, Arial, sans-serif" font-size="12" fill="#8A8675">OpenAI Agents SDK · Pydantic-typed output</text>
</svg>
